apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/pocharlies/k8s-shopify-framework-pocharlies.git//base?ref=deploy/prod
  - app-externalsecret.yaml
  - brain-relations-externalsecret.yaml
  - brain-relations-network-policy.yaml

namePrefix: bundles-

labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/instance: bundles

images:
  - name: shopify-app
    newName: harbor.e-dani.com/homelab/shopify-bundle-app
    digest: sha256:a24f4338c497044ad939efe38f5c545ea5b4eaa9630cc4ad13e5d421f31d2784

patches:
  # Inlined (not a separate file) so CI kubeconform doesn't treat it as a
  # standalone, selector-less Deployment.
  - target: { kind: Deployment, name: app }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app
      spec:
        selector:
          matchLabels:
            app.kubernetes.io/instance: bundles
        template:
          spec:
            containers:
              - name: app
                env:
                  - { name: PORT, value: "3460" }
                  - { name: SHOPIFY_APP_URL, value: "https://skirmshop.e-dani.com/bundles" }
                  - { name: SCOPES, value: "read_products,write_products,read_inventory,read_orders,write_app_proxy,read_cart_transforms,write_cart_transforms,read_discounts,write_discounts" }
                  # Shopify signs every App Proxy request with the immutable
                  # myshopifyDomain. Keep the admin and proxy boundaries on
                  # that same single canonical shop; the historical
                  # skirmshop-spain alias is not a second installation.
                  - { name: SHOPIFY_STORE, value: "ymimst-yh.myshopify.com" }
                  - { name: SHOPIFY_ALLOWED_SHOPS, value: "ymimst-yh.myshopify.com" }
                  - { name: SHOPIFY_APP_PROXY_MAX_AGE_SECONDS, value: "300" }
                  - { name: STANDALONE_CONFIGURATOR_ENABLED, value: "false" }
                  # Deterministic, tenant-bound recommendations. The API key is
                  # projected from the same Vault property used by the
                  # relations API; no credential is copied into Git.
                  - { name: BRAIN_RELATIONS_URL, value: "http://brain-product-relations.skirmshop-product-relations.svc.cluster.local:8080" }
                  - { name: BRAIN_RELATIONS_INSTANCE, value: "skirmshop" }
                  - { name: BRAIN_RELATIONS_TENANT_ID, value: "807a4817-b73a-42ce-8954-8dd5dc80b751" }
                  - { name: BRAIN_RELATIONS_STORE_ID, value: "269d0560-9c16-4db8-86e4-52867efc1901" }
                  - { name: BRAIN_RELATIONS_PROVIDER_BINDING_ID, value: "54d94645-7f69-404f-954e-edeb105bd215" }
                  - { name: BRAIN_RELATIONS_TIMEOUT_MS, value: "2500" }
                  - name: BRAIN_RELATIONS_API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: bundles-brain-relations
                        key: BRAIN_RELATIONS_API_KEY
                  # connection_limit: sin él Prisma dimensiona el pool con
                  # `cpus_fisicos * 2 + 1` LEIDO DEL HOST, no del límite del
                  # contenedor. Este pod corre en `sauvage` (48 vCPU, sin cpu
                  # limit) y arranca DOS PrismaClient (app/shopify.server.ts +
                  # el del framework en dist/db/client.js) → 96 conexiones
                  # físicas medidas el 28-07-2026, el mayor consumidor de
                  # postgres-shared, con 0 activas.
                  # application_name: trazabilidad en pg_stat_activity.
                  - { name: DATABASE_URL, value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/bundles?connection_limit=5&pool_timeout=15&connect_timeout=10&application_name=bundles-app" }
                envFrom:
                  - secretRef: { name: bundles-secrets }
  - target: { group: apps, version: v1, kind: Deployment, name: app }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 3460
  - target: { version: v1, kind: Service, name: app }
    patch: |-
      - op: add
        path: /spec/selector/app.kubernetes.io~1instance
        value: bundles
  - target: { group: traefik.io, version: v1alpha1, kind: IngressRoute, name: app }
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`skirmshop.e-dani.com`) && PathPrefix(`/bundles`)
