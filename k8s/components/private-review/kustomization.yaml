apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  # INFRA-1175: credencial OVH Object Storage para el rclone de abajo. Con el
  # namePrefix `bundles-` el objeto queda `bundles-s3-ovh` (mismo nombre que el
  # Secret target, escrito literal: kustomize no toca spec.target.name).
  - s3-ovh.externalsecret.yaml

configMapGenerator:
  - name: private-review-sync-8ab0d624b90ec479
    files:
      - sync.sh
    literals:
      - REVIEW_VERSION=review-8ab0d624b90ec479
      - REVIEW_MANIFEST_SHA256=8ab0d624b90ec47957c87697bc881d9a3933155ddcdc6b3d3094cafa64de48a7

generatorOptions:
  # This bundles-only component pins patched references to the final namePrefix.
  # The package version is already part of this immutable ConfigMap name.
  disableNameSuffixHash: true

patches:
  - target:
      kind: Deployment
      name: app
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app
      spec:
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
        template:
          spec:
            initContainers:
              - name: private-review-sync
                image: rclone/rclone:1.69.0
                command: ["sh", "/sync/sync.sh"]
                envFrom:
                  - configMapRef:
                      name: bundles-private-review-sync-8ab0d624b90ec479
                env:
                  - name: RCLONE_CONFIG_REVIEW_TYPE
                    value: s3
                  # INFRA-1175: el bucket skirmshop-drive vive ahora en OVH
                  # Object Storage (el MinIO de casa se apaga). OVH no es
                  # compatible con el provider Minio de rclone: provider Other,
                  # region sbg y force_path_style, como en los demás
                  # consumidores ya migrados.
                  - name: RCLONE_CONFIG_REVIEW_PROVIDER
                    value: Other
                  - name: RCLONE_CONFIG_REVIEW_REGION
                    value: sbg
                  - name: RCLONE_CONFIG_REVIEW_FORCE_PATH_STYLE
                    value: "true"
                  - name: RCLONE_CONFIG_REVIEW_ENDPOINT
                    value: https://s3.sbg.io.cloud.ovh.net
                  - name: REVIEW_BUCKET
                    value: skirmshop-drive
                  - name: RCLONE_CONFIG_REVIEW_ACCESS_KEY_ID
                    valueFrom:
                      secretKeyRef:
                        name: bundles-s3-ovh
                        key: AWS_ACCESS_KEY_ID
                  - name: RCLONE_CONFIG_REVIEW_SECRET_ACCESS_KEY
                    valueFrom:
                      secretKeyRef:
                        name: bundles-s3-ovh
                        key: AWS_SECRET_ACCESS_KEY
                volumeMounts:
                  - name: private-review-sync
                    mountPath: /sync
                    readOnly: true
                  - name: private-review-models
                    mountPath: /review
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    memory: 256Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: [ALL]
            containers:
              - name: app
                command: ["sh", "-ec"]
                args:
                  - |
                    ./node_modules/.bin/prisma migrate deploy
                    node build/review-tools/import-model-review.mjs /review/manifests/model-source-dossiers.json /review/manifests/existing-models-reconciled.json
                    node build/review-tools/import-private-review.mjs /review/manifests/private-review-revised-models.json /review
                    node build/review-tools/import-model-review.mjs /review/manifests/model-source-dossiers.json /review/manifests/existing-models-reconciled.json --apply
                    node build/review-tools/import-private-review.mjs /review/manifests/private-review-revised-models.json /review --apply
                    exec node ./node_modules/@remix-run/serve/dist/cli.js ./build/server/index.js
                env:
                  - name: HIDEOUT_REVIEW_ROOT
                    value: /review
                volumeMounts:
                  - name: private-review-models
                    mountPath: /review
                    readOnly: true
            volumes:
              - name: private-review-sync
                configMap:
                  name: bundles-private-review-sync-8ab0d624b90ec479
              - name: private-review-models
                emptyDir:
                  sizeLimit: 256Mi
