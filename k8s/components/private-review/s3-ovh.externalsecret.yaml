# INFRA-1175: credencial de OVH Object Storage para el initContainer
# private-review-sync (rclone). Sustituye al Secret skirmshop-drive-s3-bundles
# del MinIO de casa, que repartía el mirror de backup-hub y se retira con él.
# Forma Connect (item `ovh-object-storage-s3` + property), refreshPolicy OnChange
# para que un force-sync recoja la rotación. El nombre del objeto y del Secret
# target es `bundles-s3-ovh`: este fichero vive bajo el namePrefix `bundles-`
# del overlay, así que se declara `s3-ovh` y kustomize lo renderiza ya
# prefijado; spec.target.name se escribe con el nombre final porque kustomize
# no lo toca. Target NUEVO a propósito: el argocd-cm oculta secretStoreRef.name
# y remoteRef.key/property de los ExternalSecret, así que un cambio solo ahí
# sale Synced sin aplicarse.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-ovh
  labels:
    app.kubernetes.io/component: s3-credentials
    security.e-dani.com/rotation-class: object-storage
spec:
  refreshInterval: 24h
  refreshPolicy: OnChange
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: bundles-s3-ovh
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: ovh-object-storage-s3
        property: access_key
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: ovh-object-storage-s3
        property: secret_key
